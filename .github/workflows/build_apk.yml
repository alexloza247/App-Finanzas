name: Compilar APK desde Web

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Preparar carpeta Web
        run: |
          mkdir -p www
          rsync -av --exclude='www' --exclude='android' --exclude='.git' --exclude='.github' --exclude='node_modules' ./ www/

      - name: Configurar e Instalar Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.alexloza.appfinanzas",
            "appName": "App Finanzas",
            "webDir": "www"
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Otorgar permisos a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK Debug
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Subir APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: App-Finanzas-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
