name: Compilar APK desde Web (HTML/CSS/JS)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Inicializar Capacitor y generar proyecto Android
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "App Finanzas" "com.alexloza.appfinanzas" --web-dir .
          npx cap add android
          npx cap sync android

      - name: Otorgar permisos a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK Android
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: App-Finanzas-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
